<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPLACE — Form title</title>

<!--
  Style: Minimal (Swiss)  ·  typographic, black on white, square corners, rules instead
  of boxes. No colour except a single hairline accent and the error red.

  Fill in before publishing:
    FORM_ACTION      the Google Form's .../formResponse URL
    entry.XXXXXXXXX  one per field, taken from that Form

  Inputs are underlines rather than boxes: on a page with this much whitespace a boxed
  field reads as clutter, and the baseline rule is enough to say "write here".
-->

<style>
  :root {
    --ink: #111;
    --ink-muted: #767676;
    --rule: #111;
    --hairline: #d8d8d8;
    --error: #c00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 72px 24px 96px;
    background: #fff;
    color: var(--ink);
    font: 400 16px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  .kicker {
    margin: 0 0 28px;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-muted);
  }
  h1 {
    margin: 0 0 20px;
    font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em;
  }
  .sub { margin: 0 0 8px; color: var(--ink-muted); font-size: 15px; max-width: 42ch; }
  .rule { height: 2px; background: var(--rule); margin: 40px 0 44px; }

  .field { margin: 0 0 36px; }
  .field label {
    display: block;
    margin: 0 0 8px;
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink);
  }
  .field input, .field select, .field textarea {
    width: 100%;
    font: inherit; color: var(--ink);
    background: transparent;
    border: 0; border-bottom: 1px solid var(--hairline);
    border-radius: 0;
    padding: 6px 0;
    outline: none;
    transition: border-color .15s;
  }
  .field textarea { min-height: 92px; resize: vertical; }
  .field select { appearance: none; background:
      linear-gradient(45deg, transparent 50%, var(--ink) 50%) calc(100% - 9px) 14px/6px 6px no-repeat,
      linear-gradient(135deg, var(--ink) 50%, transparent 50%) calc(100% - 3px) 14px/6px 6px no-repeat; }
  .field input:focus, .field select:focus, .field textarea:focus { border-bottom-color: var(--ink); }
  .field input::placeholder, .field textarea::placeholder { color: #bbb; }
  .hint { margin: 6px 0 0; font-size: 12px; color: var(--ink-muted); }
  .req { color: var(--error); }

  button {
    font: 400 11px/1 inherit;
    letter-spacing: .18em; text-transform: uppercase;
    color: #fff; background: var(--ink);
    border: 1px solid var(--ink); border-radius: 0;
    padding: 15px 34px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  button:hover { background: #fff; color: var(--ink); }
  button:disabled { background: #fff; color: #bbb; border-color: #ddd; cursor: default; }

  #msg { margin: 22px 0 0; font-size: 13px; min-height: 20px; }
  #msg.ok { color: var(--ink); }
  #msg.err { color: var(--error); }
  .foot { margin: 56px 0 0; padding-top: 18px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--ink-muted); }
</style>

<div class="wrap">
  <p class="kicker">REPLACE — Section or org</p>
  <h1>REPLACE — Form title</h1>
  <p class="sub">REPLACE — one or two lines telling people what this is for and how long it takes.</p>
  <div class="rule"></div>

  <form id="f" novalidate>
    <div class="field">
      <label for="q1">Name <span class="req">*</span></label>
      <input id="q1" name="entry.XXXXXXXXX" required>
    </div>

    <div class="field">
      <label for="q2">Email <span class="req">*</span></label>
      <input id="q2" name="entry.XXXXXXXXX" type="email" required>
      <p class="hint">REPLACE — where the confirmation goes.</p>
    </div>

    <div class="field">
      <label for="q3">REPLACE — choice <span class="req">*</span></label>
      <select id="q3" name="entry.XXXXXXXXX" required>
        <option value="" disabled selected></option>
        <option>REPLACE — option one</option>
        <option>REPLACE — option two</option>
      </select>
    </div>

    <div class="field">
      <label for="q4">Notes</label>
      <textarea id="q4" name="entry.XXXXXXXXX"></textarea>
    </div>

    <button type="submit">Submit</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>

  <p class="foot">REPLACE — who to contact if something looks wrong.</p>
</div>

<script>
  var FORM_ACTION = 'https://docs.google.com/forms/d/e/REPLACE/formResponse';

  var f = document.getElementById('f'), msg = document.getElementById('msg');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!f.checkValidity()) { f.reportValidity(); return; }
    var btn = f.querySelector('button');
    btn.disabled = true; msg.className = ''; msg.textContent = 'Sending…';

    // Google Forms sends no CORS headers, so the response is opaque: a resolved fetch
    // means the request left the browser, not that the row was written.
    fetch(FORM_ACTION, { method: 'POST', mode: 'no-cors', body: new FormData(f) })
      .then(function () {
        f.reset();
        msg.className = 'ok';
        msg.textContent = 'Recorded. Thank you.';
      })
      .catch(function () {
        msg.className = 'err';
        msg.textContent = 'Could not send. Check your connection and try again.';
      })
      .then(function () { btn.disabled = false; });
  });
</script>
