<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPLACE — Form title</title>

<!--
  Style: Google (Material)  ·  outlined fields, notched floating labels, one blue accent.

  Fill in before publishing:
    FORM_ACTION      the Google Form's .../formResponse URL
    entry.XXXXXXXXX  one per field, taken from that Form

  Roboto is not loaded — Apps Script serves one file with no external requests, and a
  webfont would be an extra origin. The stack below is what Google's own products fall
  back to, so the proportions still read as Material.
-->

<style>
  :root {
    --accent: #1a73e8;
    --accent-press: #1557b0;
    --ink: #202124;
    --ink-muted: #5f6368;
    --line: #dadce0;
    --surface: #fff;
    --error: #d93025;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: #f8f9fa;
    color: var(--ink);
    font: 400 16px/1.5 Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 640px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 32px;
  }
  .accent-bar { height: 10px; border-radius: 8px 8px 0 0; background: var(--accent); margin: -32px -32px 28px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 400; letter-spacing: 0; }
  .sub { margin: 0 0 32px; color: var(--ink-muted); font-size: 14px; }

  /* Outlined field with a notched floating label. The label sits on the border, so the
     notch is painted by the label's own background rather than an SVG cut-out. */
  .field { position: relative; margin: 0 0 28px; }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 15px 15px;
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field textarea { min-height: 104px; resize: vertical; }
  .field select { appearance: none; background:
      linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%) calc(100% - 20px) 22px/6px 6px no-repeat,
      linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%) calc(100% - 14px) 22px/6px 6px no-repeat; }
  .field label {
    position: absolute; left: 12px; top: 15px;
    padding: 0 4px;
    color: var(--ink-muted);
    background: var(--surface);
    pointer-events: none;
    transition: transform .15s, color .15s, font-size .15s;
    transform-origin: left top;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label,
  .field textarea:focus + label,
  .field textarea:not(:placeholder-shown) + label,
  .field select:focus + label,
  .field select:valid + label {
    transform: translateY(-24px) scale(.75);
    color: var(--accent);
  }
  .field select:valid + label { color: var(--ink-muted); }
  .req { color: var(--error); }

  button {
    font: 500 14px/1 Roboto, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .25px;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 4px;
    padding: 12px 24px;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  button:hover { background: var(--accent-press); box-shadow: 0 1px 3px rgba(60,64,67,.3); }
  button:disabled { background: var(--line); color: var(--ink-muted); cursor: default; box-shadow: none; }

  #msg { margin: 20px 0 0; font-size: 14px; min-height: 20px; }
  #msg.ok { color: #188038; }
  #msg.err { color: var(--error); }
  .done h1 { color: #188038; }
</style>

<div class="card">
  <div class="accent-bar"></div>
  <h1>REPLACE — Form title</h1>
  <p class="sub">REPLACE — one line telling people what this is for. <span class="req">*</span> marks required.</p>

  <form id="f" novalidate>
    <div class="field">
      <input id="q1" name="entry.XXXXXXXXX" placeholder=" " required>
      <label for="q1">Your name <span class="req">*</span></label>
    </div>

    <div class="field">
      <input id="q2" name="entry.XXXXXXXXX" type="email" placeholder=" " required>
      <label for="q2">Email <span class="req">*</span></label>
    </div>

    <div class="field">
      <select id="q3" name="entry.XXXXXXXXX" required>
        <option value="" disabled selected hidden></option>
        <option>REPLACE — option one</option>
        <option>REPLACE — option two</option>
      </select>
      <label for="q3">REPLACE — choice question <span class="req">*</span></label>
    </div>

    <div class="field">
      <textarea id="q4" name="entry.XXXXXXXXX" placeholder=" "></textarea>
      <label for="q4">Anything else?</label>
    </div>

    <button type="submit">Submit</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</div>

<script>
  var FORM_ACTION = 'https://docs.google.com/forms/d/e/REPLACE/formResponse';

  var f = document.getElementById('f'), msg = document.getElementById('msg');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!f.checkValidity()) { f.reportValidity(); return; }
    var btn = f.querySelector('button');
    btn.disabled = true; msg.className = ''; msg.textContent = 'Sending…';

    // Google Forms does not send CORS headers, so the response is opaque: a resolved
    // fetch means the request left the browser, not that the row was written. There is
    // no way to read the real result from a page like this.
    fetch(FORM_ACTION, { method: 'POST', mode: 'no-cors', body: new FormData(f) })
      .then(function () {
        document.querySelector('.card').classList.add('done');
        f.reset();
        msg.className = 'ok';
        msg.textContent = 'Thanks — your response has been recorded.';
      })
      .catch(function () {
        msg.className = 'err';
        msg.textContent = 'Could not send. Check your connection and try again.';
      })
      .then(function () { btn.disabled = false; });
  });
</script>
